<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учёт пробега</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #eee;
            padding: 16px;
            max-width: 900px;
            margin: 0 auto;
        }
        h1 { color: #4CAF50; margin-bottom: 8px; font-size: 26px; }
        .user { color: #888; font-size: 14px; margin-bottom: 16px; }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: #2e7d32;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .stat-value { font-size: 24px; font-weight: bold; }
        .stat-label { font-size: 12px; color: #ccc; margin-top: 4px; }

        h2 {
            color: #4CAF50;
            font-size: 20px;
            margin: 20px 0 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .status-block {
            background: #2a2a2a;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status-block p { margin: 6px 0; font-size: 15px; }
        .status-block b { color: #FFEB3B; }

        .oil-bar {
            background: #333;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .oil-bar-fill {
            height: 100%;
            transition: width 0.5s ease;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        th { background: #2e7d32; color: #fff; }
        tr:hover { background: #333; }

        .delete-btn {
            background: #F44336;
            border: none;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
        }
        .delete-btn:hover { background: #d32f2f; }

        .empty { color: #888; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <h1>Учёт пробега</h1>
    <div class="user">Привет, Сергей! Ваш ID: 8130365822</div>

    <div class="stats">
        <div class="stat-card">
            <div class="stat-value" id="stat-count">0</div>
            <div class="stat-label">Всего записей</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-max">0</div>
            <div class="stat-label">Общий пробег (макс.)</div>
        </div>
        <div class="stat-card">
            <div class="stat-value" id="stat-avg">0</div>
            <div class="stat-label">Средний пробег</div>
        </div>
    </div>

    <h2>📡 Мониторинг состояния</h2>
    <div class="status-block" id="status-block">
        <p>Загрузка...</p>
    </div>

    <h2>📋 Записи обслуживания</h2>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Пробег</th>
                <th>Авто</th>
                <th>Узел</th>
                <th>Тип</th>
                <th>Действие</th>
                <th>Дата</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="records-body">
            <tr><td colspan="8" class="empty">Загрузка...</td></tr>
        </tbody>
    </table>

    <script>
        async function loadRecords() {
            try {
                const res = await fetch('/api/records');
                const records = await res.json();

                document.getElementById('stat-count').textContent = records.length;
                const maxMileage = records.length ? Math.max(...records.map(r => r.mileage)) : 0;
                document.getElementById('stat-max').textContent = maxMileage;
                const avgMileage = records.length
                    ? Math.round(records.reduce((s, r) => s + r.mileage, 0) / records.length)
                    : 0;
                document.getElementById('stat-avg').textContent = avgMileage;

                const tbody = document.getElementById('records-body');
                if (records.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="empty">Нет записей</td></tr>';
                    return;
                }

                const sorted = records.sort((a, b) => new Date(b.date) - new Date(a.date));
                tbody.innerHTML = sorted.map((r, i) => `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${r.mileage} км</td>
                        <td>${r.car || '—'}</td>
                        <td>${r.part || '—'}</td>
                        <td>${r.type || '—'}</td>
                        <td>${r.description || '—'}</td>
                        <td>${r.dateLocale || r.date}</td>
                        <td>
                            <button class="delete-btn" onclick="deleteRecord(${r.id})">🗑️</button>
                        </td>
                    </tr>
                `).join('');
            } catch (e) {
                console.error('loadRecords error:', e);
            }
        }

        async function deleteRecord(id) {
            if (!confirm('Удалить запись?')) return;
            try {
                await fetch(`/api/records/${id}`, { method: 'DELETE' });
                loadRecords();
            } catch (e) {
                alert('Ошибка удаления: ' + e.message);
            }
        }

        async function loadStatus() {
            try {
                const res = await fetch('/api/status');
                const json = await res.json();

                const d = json.data;
                const oil = json.oil || {};

                let html = '';

                if (d) {
                    html += `
                        <p>Обороты: <b>${d.rpm}</b> об/мин</p>
                        <p>Скорость: <b>${d.speed}</b> км/ч</p>
                        <p>Температура ОЖ: <b>${d.coolantTemp}</b> °C</p>
                        <p>Нагрузка: <b>${d.engineLoad}</b>%</p>
                        <p>Дроссель: <b>${d.throttlePos}</b>%</p>
                        <p>Температура воздуха: <b>${d.intakeTemp}</b> °C</p>
                        <p>Напряжение: <b>${d.voltage}</b> В</p>
                        <p>Температура масла: <b>${d.oilTemp}</b> °C</p>
                    `;
                } else {
                    html += `<p style="color:#FF9800;">⚠️ Нет данных мониторинга. Подключите OBD2Manual.</p>`;
                }

                html += `<hr style="border-color:#444; margin:12px 0;">
                         <h3 style="color:#4CAF50; font-size:16px;">🛢️ Замена масла (каждые ${oil.interval || 7000} км)</h3>`;

                if (oil.lastChangeMileage !== null && oil.lastChangeMileage !== undefined) {
                    let color = '#4CAF50';
                    let icon = '✅';
                    let statusText = 'Всё в порядке';

                    if (oil.status === 'overdue') {
                        color = '#F44336'; icon = '🚨';
                        statusText = 'ПОРА МЕНЯТЬ!';
                    } else if (oil.status === 'soon') {
                        color = '#FF9800'; icon = '⚠️';
                        statusText = 'Скоро менять';
                    }

                    html += `
                        <p>Последняя замена: <b>${oil.lastChangeMileage}</b> км (${oil.lastChangeDate})</p>
                        <p>Пройдено после замены: <b>${oil.kmSinceChange}</b> км</p>
                        <p style="color:${color}; font-size:18px; font-weight:bold;">
                            ${icon} Осталось: <b>${oil.kmRemaining}</b> км — ${statusText}
                        </p>
                        <div class="oil-bar">
                            <div class="oil-bar-fill" style="width:${oil.percentUsed}%; background:${color};"></div>
                        </div>
                        <p style="font-size:12px; color:#888;">Использовано ${oil.percentUsed}% ресурса</p>
                    `;
                } else {
                    html += `<p>Нет данных о замене масла. Добавьте запись с типом «Замена масла».</p>`;
                }

                if (d && d.timestamp) {
                    html += `<p style="font-size:12px; color:#888; margin-top:8px;">Обновлено: ${new Date(d.timestamp).toLocaleString()}</p>`;
                }

                document.getElementById('status-block').innerHTML = html;
            } catch (e) {
                document.getElementById('status-block').innerHTML =
                    '<p>Ошибка загрузки статуса</p>';
            }
        }

        loadRecords();
        loadStatus();
        setInterval(loadRecords, 30000);
        setInterval(loadStatus, 10000);
    </script>
</body>
</html>
